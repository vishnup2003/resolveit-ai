services:
  mysql-db:
    image: mysql:8.0
    container_name: resolveit-mysql
    environment:
      MYSQL_DATABASE: resolveit_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: resolveit-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/resolveit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      - mysql-db

  frontend:
    build: ./frontend
    container_name: resolveit-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data: